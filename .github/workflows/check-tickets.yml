name: Check movie tickets

on:
  schedule:
        - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run ticket check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python check_tickets.py

      - name: Commit updated state
        run: |
          git config user.name "ticket-bot"
          git config user.email "ticket-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update notification state"
          git push
